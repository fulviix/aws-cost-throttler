redis:
  host: 127.0.0.1
  port: 6379

budget:
  provider: mock
  monthly_limit_usd: 500
  thresholds:
    warning: 95
    critical: 80
  check_interval_seconds: 60

routes:
  - path: /api/orders
    method: FETCH
    limit: 100
    window_seconds: 60
    cost_sensitivity: high

default:
  limit: 200
  window_seconds: 60
  cost_sensitivity: medium